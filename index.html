function pesquisar() {
  const input = document.getElementById("pesquisaInput").value.toLowerCase();
  const produtos = document.querySelectorAll(".produto");

  produtos.forEach(prod => {
    const texto = prod.innerText.toLowerCase();
    prod.style.display = texto.includes(input) ? "block" : "none";
  });
}

function sugerirCategoria(nome) {
  const texto = String(nome || "").toLowerCase();

  if (
    texto.includes("chaleira") ||
    texto.includes("panela") ||
    texto.includes("pote") ||
    texto.includes("cozinha") ||
    texto.includes("copo") ||
    texto.includes("talher") ||
    texto.includes("garrafa") ||
    texto.includes("filtro") ||
    texto.includes("frigideira") ||
    texto.includes("escorredor")
  ) {
    return "Cozinha";
  }

  if (
    texto.includes("coberdrom") ||
    texto.includes("cobertor") ||
    texto.includes("lençol") ||
    texto.includes("lencol") ||
    texto.includes("travesseiro") ||
    texto.includes("almofada") ||
    texto.includes("edredom") ||
    texto.includes("colcha")
  ) {
    return "Quarto";
  }

  if (
    texto.includes("banheiro") ||
    texto.includes("toalha") ||
    texto.includes("sabonete") ||
    texto.includes("escova") ||
    texto.includes("shampoo")
  ) {
    return "Banheiro";
  }

  if (
    texto.includes("planta") ||
    texto.includes("vaso") ||
    texto.includes("decor") ||
    texto.includes("luminária") ||
    texto.includes("luminaria") ||
    texto.includes("quadro") ||
    texto.includes("flor")
  ) {
    return "Decoração";
  }

  if (
    texto.includes("organizador") ||
    texto.includes("suporte") ||
    texto.includes("caixa") ||
    texto.includes("prateleira") ||
    texto.includes("cabide") ||
    texto.includes("maquiagem")
  ) {
    return "Organização";
  }

  return "Organização";
}

function criarCardProduto(prod) {
  const card = document.createElement("div");
  card.className = "produto bg-gray-900 rounded-2xl overflow-hidden shadow-lg hover:scale-105 transition duration-300";

  const img = document.createElement("img");
  img.src = prod.imagem;
  img.className = "w-full h-64 object-cover";

  const conteudo = document.createElement("div");
  conteudo.className = "p-4";

  const nome = document.createElement("h2");
  nome.className = "font-bold text-lg min-h-[60px]";
  nome.textContent = prod.nome;

  const preco = document.createElement("p");
  preco.className = "text-green-400 text-2xl font-bold mt-2";
  preco.textContent = prod.preco;

  const botaoOferta = document.createElement("button");
  botaoOferta.className = "block w-full mt-4 bg-orange-500 hover:bg-orange-600 text-white py-3 rounded-xl font-bold";
  botaoOferta.textContent = "Ver Oferta 🛒";
  botaoOferta.onclick = function() {
    abrirShopee(prod.link);
  };

  conteudo.appendChild(nome);
  conteudo.appendChild(preco);
  conteudo.appendChild(botaoOferta);

  if (adminLogado) {
    const botaoExcluir = document.createElement("button");
    botaoExcluir.className = "block w-full mt-2 bg-red-500 text-white py-2 rounded-xl font-bold";
    botaoExcluir.textContent = "Excluir ❌";
    botaoExcluir.onclick = function() {
      excluirProduto(prod.id);
    };

    conteudo.appendChild(botaoExcluir);
  }

  card.appendChild(img);
  card.appendChild(conteudo);

  return card;
}

function renderProdutos() {
  produtosContainer.innerHTML = `
    <div class="text-center text-xl">
      Carregando...
    </div>
  `;

  db.collection("produtos")
    .orderBy("criadoEm", "desc")
    .onSnapshot(snapshot => {
      produtosContainer.innerHTML = "";

      const categorias = {
        "Cozinha": [],
        "Quarto": [],
        "Banheiro": [],
        "Decoração": [],
        "Organização": []
      };

      snapshot.forEach(doc => {
        const prod = doc.data();

        const categoriaProduto =
          prod.categoria && prod.categoria !== "undefined"
            ? prod.categoria
            : sugerirCategoria(prod.nome);

        if (!categorias[categoriaProduto]) {
          categorias[categoriaProduto] = [];
        }

        categorias[categoriaProduto].push({
          id: doc.id,
          ...prod,
          categoria: categoriaProduto
        });
      });

      for (const categoria in categorias) {
        if (categorias[categoria].length === 0) {
          continue;
        }

        const section = document.createElement("section");
        section.id = categoria;

        const titulo = document.createElement("h2");
        titulo.className = "text-3xl font-bold text-orange-400 mb-6";
        titulo.textContent = categoria;

        const grid = document.createElement("div");
        grid.className = "grid md:grid-cols-3 gap-6";

        categorias[categoria].forEach(prod => {
          grid.appendChild(criarCardProduto(prod));
        });

        section.appendChild(titulo);
        section.appendChild(grid);
        produtosContainer.appendChild(section);
      }

      pesquisar();
    }, error => {
      produtosContainer.innerHTML = `
        <div class="text-center text-red-400 text-xl">
          Erro ao carregar produtos.
        </div>
      `;

      console.error(error);
    });
}

function addProduto() {
  const nome = document.getElementById("nome").value;
  const preco = document.getElementById("preco").value;
  const imagem = document.getElementById("imagem").value;
  const link = document.getElementById("link").value;
  const categoria = document.getElementById("categoria").value;

  if (!nome || !preco || !imagem || !link) {
    alert("Preencha todos os campos");
    return;
  }

  db.collection("produtos").add({
    nome,
    preco,
    imagem,
    link,
    categoria,
    criadoEm: firebase.firestore.FieldValue.serverTimestamp()
  }).then(() => {
    alert("Produto publicado 🚀");

    document.getElementById("nome").value = "";
    document.getElementById("preco").value = "";
    document.getElementById("imagem").value = "";
    document.getElementById("link").value = "";
  }).catch(error => {
    alert("Erro ao publicar produto");
    console.error(error);
  });
}
