<script>
const SENHA_ADMIN = "Lezinho1579@";

const firebaseConfig = {
  apiKey: "SUA_API_KEY_AQUI",
  authDomain: "casaeachadosshopee.firebaseapp.com",
  projectId: "casaeachadosshopee",
  storageBucket: "casaeachadosshopee.firebasestorage.app",
  messagingSenderId: "288736027823",
  appId: "1:288736027823:web:d2e6e208efb345f7af605a"
};

firebase.initializeApp(firebaseConfig);

const db = firebase.firestore();

const produtosContainer = document.getElementById("produtos");
const loginAdmin = document.getElementById("loginAdmin");
const adminPanel = document.getElementById("adminPanel");

let adminLogado = false;

document.addEventListener("keydown", function(e) {
  if (e.ctrlKey && e.altKey && e.key.toLowerCase() === "a") {
    loginAdmin.classList.toggle("hidden");
  }
});

const urlParams = new URLSearchParams(window.location.search);

if (urlParams.get("painel") === "1579lz") {
  loginAdmin.classList.remove("hidden");
}

function verificarSenha() {
  const senha = document.getElementById("senha").value;

  if (senha === SENHA_ADMIN) {
    adminLogado = true;
    loginAdmin.classList.add("hidden");
    adminPanel.classList.remove("hidden");
    renderProdutos();
  } else {
    alert("Senha incorreta");
  }
}

function pesquisar() {
  const input = document
    .getElementById("pesquisaInput")
    .value
    .toLowerCase();

  const produtos = document.querySelectorAll(".produto");

  produtos.forEach(prod => {
    const texto = prod.innerText.toLowerCase();
    prod.style.display = texto.includes(input) ? "block" : "none";
  });
}

function sugerirCategoria(nome) {
  const texto = nome.toLowerCase();

  if (
    texto.includes("chaleira") ||
    texto.includes("panela") ||
    texto.includes("pote") ||
    texto.includes("cozinha") ||
    texto.includes("copo") ||
    texto.includes("talher") ||
    texto.includes("garrafa") ||
    texto.includes("filtro") ||
    texto.includes("frigideira") ||
    texto.includes("escorredor")
  ) {
    return "Cozinha";
  }

  if (
    texto.includes("coberdrom") ||
    texto.includes("cobertor") ||
    texto.includes("lençol") ||
    texto.includes("lencol") ||
    texto.includes("travesseiro") ||
    texto.includes("almofada") ||
    texto.includes("edredom") ||
    texto.includes("colcha")
  ) {
    return "Quarto";
  }

  if (
    texto.includes("banheiro") ||
    texto.includes("toalha") ||
    texto.includes("sabonete") ||
    texto.includes("escova") ||
    texto.includes("shampoo") ||
    texto.includes("porta shampoo")
  ) {
    return "Banheiro";
  }

  if (
    texto.includes("planta") ||
    texto.includes("vaso") ||
    texto.includes("decor") ||
    texto.includes("luminária") ||
    texto.includes("luminaria") ||
    texto.includes("quadro") ||
    texto.includes("flor")
  ) {
    return "Decoração";
  }

  if (
    texto.includes("organizador") ||
    texto.includes("suporte") ||
    texto.includes("caixa") ||
    texto.includes("prateleira") ||
    texto.includes("cabide") ||
    texto.includes("maquiagem")
  ) {
    return "Organização";
  }

  return "Organização";
}

function renderProdutos() {
  produtosContainer.innerHTML = `
    <div class="text-center text-xl">
      Carregando...
    </div>
  `;

  db.collection("produtos")
    .orderBy("criadoEm", "desc")
    .onSnapshot(snapshot => {
      produtosContainer.innerHTML = "";

      const categorias = {
        Cozinha: [],
        Quarto: [],
        Banheiro: [],
        Decoração: [],
        Organização: []
      };

      snapshot.forEach(doc => {
        const prod = doc.data();

        const categoriaProduto =
          prod.categoria && prod.categoria !== "undefined"
            ? prod.categoria
            : sugerirCategoria(prod.nome || "");

        if (!categorias[categoriaProduto]) {
          categorias[categoriaProduto] = [];
        }

        categorias[categoriaProduto].push({
          id: doc.id,
          ...prod,
          categoria: categoriaProduto
        });
      });

      for (const categoria in categorias) {
        if (categorias[categoria].length === 0) {
          continue;
        }

        produtosContainer.innerHTML += `
          <section id="${categoria}">
            <h2 class="text-3xl font-bold text-orange-400 mb-6">
              ${categoria}
            </h2>

            <div
              id="grid-${categoria}"
              class="grid md:grid-cols-3 gap-6">
            </div>
          </section>
        `;

        const grid = document.getElementById(`grid-${categoria}`);

        categorias[categoria].forEach(prod => {
          grid.innerHTML += `
            <div class="produto bg-gray-900 rounded-2xl overflow-hidden shadow-lg hover:scale-105 transition duration-300">
              <img
                src="${prod.imagem}"
                class="w-full h-64 object-cover"
              />

              <div class="p-4">
                <h2 class="font-bold text-lg min-h-[60px]">
                  ${prod.nome}
                </h2>

                <p class="text-green-400 text-2xl font-bold mt-2">
                  ${prod.preco}
                </p>

                <button
                  onclick="abrirShopee('${prod.link}')"
                  class="block w-full mt-4 bg-orange-500 hover:bg-orange-600 text-white py-3 rounded-xl font-bold">
                  Ver Oferta 🛒
                </button>

                ${adminLogado ? `
                  <button
                    onclick="excluirProduto('${prod.id}')"
                    class="block w-full mt-2 bg-red-500 text-white py-2 rounded-xl font-bold">
                    Excluir ❌
                  </button>
                ` : ""}
              </div>
            </div>
          `;
        });
      }

      pesquisar();
    });
}

function addProduto() {
  const nome = document.getElementById("nome").value;
  const preco = document.getElementById("preco").value;
  const imagem = document.getElementById("imagem").value;
  const link = document.getElementById("link").value;
  const categoria = document.getElementById("categoria").value;

  if (!nome || !preco || !imagem || !link) {
    alert("Preencha todos os campos");
    return;
  }

  db.collection("produtos").add({
    nome,
    preco,
    imagem,
    link,
    categoria,
    criadoEm: firebase.firestore.FieldValue.serverTimestamp()
  });

  alert("Produto publicado 🚀");

  document.getElementById("nome").value = "";
  document.getElementById("preco").value = "";
  document.getElementById("imagem").value = "";
  document.getElementById("link").value = "";
}

function corrigirCategoriasAntigas() {
  if (!adminLogado) {
    alert("Entre no painel admin primeiro");
    return;
  }

  db.collection("produtos").get().then(snapshot => {
    snapshot.forEach(doc => {
      const prod = doc.data();

      if (!prod.categoria || prod.categoria === "undefined") {
        const categoria = sugerirCategoria(prod.nome || "");

        db.collection("produtos").doc(doc.id).update({
          categoria: categoria
        });
      }
    });

    alert("Categorias corrigidas com sucesso");
  });
}

function excluirProduto(id) {
  if (confirm("Deseja excluir este produto?")) {
    db.collection("produtos").doc(id).delete();
    alert("Produto excluído");
  }
}

function abrirShopee(link) {
  const isMobile = /Android|iPhone|iPad|iPod/i.test(navigator.userAgent);

  if (isMobile) {
    window.location.href = link.replace(
      "https://shopee.com.br",
      "shopee://"
    );

    setTimeout(() => {
      window.open(link, "_blank");
    }, 1200);
  } else {
    window.open(link, "_blank");
  }
}

renderProdutos();
</script>
